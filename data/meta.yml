- file: length_of_growing_season_east_west.csv
  figure: Figure 2
  figure_title: 'Figure 2. Length of Growing Season in the Contiguous 48 States, 1895-2023:
    West Versus East'
  source_file: growing-season_fig-2.csv
  source_sha256: 68703af96e8d95aa014b87556c2622b2ca5cfc727f6e23d2fa4a9efa356fa195
  source_encoding: UTF-8
  data_source: Kunkel, 2024
  web_update: June 2024
  unit: days
  rows: 258
  columns:
  - name: year
    type: integer
    description: Calendar year, 1895-2023.
  - name: region
    type: character
    description: '''east'' or ''west'', the two US regions compared in this figure.'
  - name: value
    type: number
    description: Deviation of regional growing season length from the 1895-2023 average,
      in days.
- file: length_of_growing_season_by_state.csv
  figure: Figure 3
  figure_title: Figure 3. Change in Length of Growing Season by State, 1895-2023
  source_file: growing-season_fig-3.csv
  source_sha256: 1c57a7c821fb42dabd50d8e87a07230e329b0657d2c243406ff93c62e05b58a0
  source_encoding: UTF-8
  data_source: Kunkel, 2024
  web_update: June 2024
  unit: days change
  rows: 47
  columns:
  - name: state
    type: character
    description: US state name (contiguous 48 states).
  - name: value
    type: number
    description: Total change in growing season length from 1895 to 2023, in days.
- file: length_of_growing_season_frost_timing.csv
  figure: Figure 4
  figure_title: Figure 4. Timing of the Last Spring Frost and First Fall Frost in
    the Contiguous 48 States, 1895-2023
  source_file: growing-season_fig-4.csv
  source_sha256: 80f58167304629b1fa55a2770176080fef588c45169be97254bf3e7433176ebf
  source_encoding: UTF-8
  data_source: Kunkel, 2024
  web_update: June 2024
  unit: days
  rows: 258
  columns:
  - name: year
    type: integer
    description: Calendar year, 1895-2023.
  - name: event
    type: character
    description: '''last_spring_frost'' or ''first_fall_frost'', the two frost timing
      series shown in this figure.'
  - name: value
    type: number
    description: Deviation of national frost date from the 1895-2023 average, in days;
      positive values indicate a later frost date.
- file: last_spring_frost_by_state.csv
  figure: Figure 5
  figure_title: Figure 5. Change in Timing of Last Spring Frost by State, 1895-2023
  source_file: growing-season_fig-5.csv
