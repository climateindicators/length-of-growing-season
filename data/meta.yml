datasets:
- file: length_of_growing_season_national.csv
  figure: Figure 1
  figure_title: Figure 1. Length of Growing Season in the Contiguous 48 States, 1895-2023
  source_file: growing-season_fig-1.csv
  source_sha256: bf6d56dc8eef47a6a4c2a3e15e572855493de153b08327a183a8d3fe7c9541b2
