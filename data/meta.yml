  web_update: June 2024
  unit: days change
  rows: 47
  columns:
  - name: state
    type: character
    description: US state name (contiguous 48 states).
  - name: value
    type: number
    description: Total change in first fall frost date from 1895 to 2023, in days;
      positive values indicate a later frost date.
