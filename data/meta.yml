  data_source: Kunkel, 2024
  web_update: June 2024
  unit: days change
  rows: 47
  columns:
  - name: state
    type: character
    description: US state name (contiguous 48 states).
  - name: value
    type: number
    description: Total change in last spring frost date from 1895 to 2023, in days;
      negative values indicate an earlier frost date.
- file: first_fall_frost_by_state.csv
  figure: Figure 6
